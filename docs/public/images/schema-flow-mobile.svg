<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">A schema becomes frontend data</title><desc id="desc">Your JSON template goes to Gobi, which sends ordinary HTTP JSON responses to your frontend.</desc><g font-family="sans-serif"><rect x="20" y="20" width="320" height="130" rx="9" fill="#fff" stroke="#cdd7c7"/><rect x="20" y="190" width="320" height="130" rx="9" fill="#236b48"/><rect x="20" y="360" width="320" height="130" rx="9" fill="#fff" stroke="#cdd7c7"/><g font-size="21" font-weight="600" fill="#253d2c"><text x="42" y="56">Your schema</text><text x="42" y="226" fill="#fff">Gobi</text><text x="42" y="396">Your frontend</text></g><g font-size="14" fill="#576c55"><text x="42" y="87">Routes, generators, Array, Ref</text><text x="42" y="121" font-family="monospace">api.gobi.json</text><text x="42" y="257" fill="#e2efda">A Go server on your machine</text><text x="42" y="291" fill="#e2efda" font-family="monospace">GET /api/dashboard</text><text x="42" y="427">Real HTTP. Ordinary JSON.</text><text x="42" y="461" font-family="monospace">fetch('/api/dashboard')</text></g></g><g stroke="#67936d" stroke-width="2" fill="none"><path d="M180 157v26m-6-8 6 8 6-8M180 327v26m-6-8 6 8 6-8"/></g></svg>
