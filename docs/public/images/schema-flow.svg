<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">From JSON schema to a working frontend</title><desc id="desc">A .gobi.json file defines routes, generators and references. Gobi turns the template into HTTP responses. Your frontend consumes ordinary JSON.</desc><g font-family="sans-serif" fill="#253d2c"><rect x="35" y="36" width="260" height="148" rx="10" fill="#fff" stroke="#cdd7c7"/><rect x="370" y="36" width="260" height="148" rx="10" fill="#236b48"/><rect x="705" y="36" width="260" height="148" rx="10" fill="#fff" stroke="#cdd7c7"/><g font-size="20" font-weight="600"><text x="59" y="77">Your schema</text><text x="394" y="77" fill="#fff">Gobi</text><text x="729" y="77">Your frontend</text></g><g font-size="14" fill="#576c55"><text x="59" y="112">Routes, generators, Array, Ref</text><text x="59" y="150" font-family="monospace">api.gobi.json</text><text x="394" y="112" fill="#e2efda">A Go server on your machine</text><text x="394" y="150" fill="#e2efda" font-family="monospace">GET /api/dashboard</text><text x="729" y="112">Real HTTP. Ordinary JSON.</text><text x="729" y="150" font-family="monospace">fetch('/api/dashboard')</text></g></g><g stroke="#67936d" stroke-width="2" fill="none"><path d="M308 110h45m-8-6 8 6-8 6M643 110h45m-8-6 8 6-8 6"/></g></svg>
